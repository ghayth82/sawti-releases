name: Mirror models to Hugging Face

# Copies every model Sawti downloads (speech models in all languages, the
# speaker-separation models and the Piper voices) to huggingface.co/GhaythMahadin,
# which the app tries first. Runs by itself after every installer build, so a
# model added to Sawti is copied before users need it. Safe to re-run: files
# already copied are skipped.
# Secrets: HF_TOKEN (Hugging Face, Write) and SAWTI_SOURCE_TOKEN (read-only
# token for the private source, only the model lists and the script are read).
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Optional: comma-separated ids (diarization, piper or model ids; empty = all)"
        required: false
        default: ""
  workflow_run:
    workflows: ["Build Sawti installers"]
    types: [completed]

concurrency:
  group: mirror-models
  cancel-in-progress: false

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ghayth82/sawti
          token: ${{ secrets.SAWTI_SOURCE_TOKEN }}
          persist-credentials: false
          sparse-checkout: |
            scripts/mirror_to_hf.py
            src-tauri/src/catalog/catalog.json
            src-tauri/src/piper_voices.json
          sparse-checkout-cone-mode: false
      - id: ids
        env:
          ONLY: ${{ inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then
            ids=$(python3 -c "import json,os;print(json.dumps([s.strip() for s in os.environ['ONLY'].split(',') if s.strip()]))")
          else
            ids=$(python3 scripts/mirror_to_hf.py --list)
          fi
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          echo "$ids"

  mirror:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        model: ${{ fromJson(needs.list.outputs.ids) }}
    name: ${{ matrix.model }}
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
        with:
          repository: ghayth82/sawti
          token: ${{ secrets.SAWTI_SOURCE_TOKEN }}
          persist-credentials: false
          sparse-checkout: |
            scripts/mirror_to_hf.py
            src-tauri/src/catalog/catalog.json
            src-tauri/src/piper_voices.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "huggingface_hub[hf_xet]>=0.30"
      - name: Copy ${{ matrix.model }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_OWNER: GhaythMahadin
          ONLY: ${{ matrix.model }}
        run: python scripts/mirror_to_hf.py
